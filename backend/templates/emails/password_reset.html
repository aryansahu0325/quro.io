<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; background-color: #0c0d10; color: #e2e8f0; padding: 20px; }
        .container { max-width: 550px; margin: 0 auto; background-color: #121318; border: 1px solid #1f2937; border-radius: 16px; padding: 32px; text-align: center; }
        .otp-code { font-family: monospace; font-size: 32px; font-weight: 800; color: #ef4444; letter-spacing: 6px; padding: 20px; border: 1px solid #ef4444; border-radius: 12px; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="color: white;">Password Reset Request</h2>
        <p>We received a request to reset the password for your Quro AI account. Enter the following 6-digit code to reset it:</p>
        <div class="otp-code">{{ otp }}</div>
        <p style="font-size: 12px; color: #475569;">This code expires in 15 minutes. If you did not request this, please secure your account.</p>
    </div>
</body>
</html>
