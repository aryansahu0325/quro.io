<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; background-color: #0c0d10; color: #e2e8f0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background-color: #121318; border: 1px solid #1f2937; border-radius: 16px; overflow: hidden; }
        .header { background: linear-gradient(135deg, #064e3b 0%, #022c22 100%); padding: 32px; text-align: center; }
        .logo { font-size: 24px; font-weight: 800; color: #ffffff; text-decoration: none; }
        .logo-dot { color: #10b981; }
        .content { padding: 40px 32px; color: #e2e8f0; line-height: 1.6; }
        .footer { padding: 20px; text-align: center; font-size: 12px; color: #475569; border-top: 1px solid #1f2937; }
        a { color: #10b981; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="logo">quro<span class="logo-dot">.</span>io</span>
        </div>
        <div class="content">
            <!-- Dynamic Content Injected Here -->
            {{ html_content | safe }}
        </div>
        <div class="footer">
            You are receiving this email because you are a registered user at Quro AI.<br>
            © {{ current_year }} Quro AI. All rights reserved.
        </div>
    </div>
</body>
</html>
