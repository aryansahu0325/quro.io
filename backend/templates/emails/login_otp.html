<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; background-color: #0c0d10; color: #e2e8f0; padding: 20px; }
        .container { max-width: 550px; margin: 0 auto; background-color: #121318; border: 1px solid #1f2937; border-radius: 16px; padding: 32px; text-align: center; }
        .otp-code { font-family: monospace; font-size: 32px; font-weight: 800; color: #10b981; letter-spacing: 6px; padding: 20px; border: 1px solid #10b981; border-radius: 12px; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="color: white;">Your One-Time Login Code</h2>
        <p>Enter the following 6-digit code on the sign-in modal to access your Quro AI workspace. This code is unique and expires in 10 minutes:</p>
        <div class="otp-code">{{ otp }}</div>
        <p style="font-size: 12px; color: #475569;">If you did not request this login code, you can safely ignore this email.</p>
    </div>
</body>
</html>
